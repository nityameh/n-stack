# n-stack CI — copy to .github/workflows/ (via `nstack-project ci`), then adapt the
# "Set up toolchain" steps to the project's language. Make the `gate` and `verify`
# jobs required checks in branch protection so they cannot be skipped.
name: n-stack

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: n-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # --- Set up toolchain (Node example; replace for Python/Go/...) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ------------------------------------------------------------------
      - name: Verify (command from .n-stack/config.json)
        run: sh -c "$(node -p "require('./.n-stack/config.json').verify")"

  # Delete this job if the project has no Playwright tests.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: n-stack ship gate (review, QA, docs, migrations)
        run: node .n-stack/bin/gate.mjs ship --base origin/${{ github.base_ref }} --skip-verify --skip-secrets
